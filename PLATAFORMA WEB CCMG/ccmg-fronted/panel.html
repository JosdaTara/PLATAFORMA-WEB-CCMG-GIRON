<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirigiendo | CCMG PVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="icon" type="image/png" href="img/logo.png">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div id="loader"><img src="img/logo.png" alt="Cargando..."></div>
<div class="login-wrap">
  <div class="container text-center">
    <img src="img/logo.png" alt="Logo CCMG" class="logo-login mb-3">
    <p class="text-muted mb-0"><span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Redirigiendo a tu panel…</p>
    <noscript><p class="mt-3"><a href="login.html" class="btn btn-ccmg">Ir al inicio de sesión</a></p></noscript>
  </div>
</div>

<!-- Página de compatibilidad: el panel antiguo mezclaba módulos.
     Ahora solo envía al módulo que corresponde al rol (RNF04). -->
<script src="js/auth.js"></script>
<script src="js/loader.js"></script>
<script>
  (function () {
    var raw = sessionStorage.getItem('ccmg');
    if (!raw) {
      window.location.replace('login.html');
      return;
    }
    try {
      var sesion = JSON.parse(raw);
      window.location.replace(panelPorRol(sesion.rol));
    } catch (e) {
      sessionStorage.removeItem('ccmg');
      window.location.replace('login.html');
    }
  })();
</script>
</body>
</html>
