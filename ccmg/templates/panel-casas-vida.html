<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casas de Vida | CCMG PVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body class="panel-body">
<div id="loader"><img src="{% static 'img/logo.png' %}" alt="Cargando..."></div>

<aside class="sidebar" id="sidebar">
  <div class="marca text-center">
    <img src="{% static 'img/logo-blanco.png' %}" alt="Logo CCMG" class="logo-side">
    <div class="mt-2">CCMG · Girón</div>
    <small class="marca-sub">Casas de Vida</small>
  </div>
  <nav id="menu" aria-label="Menú del módulo Casas de Vida"></nav>
  <a href="{% url 'cuentas:selector_modulo' %}" id="cambiarModulo" class="cambiar-modulo d-none">
    <i class="bi bi-arrow-left-right me-2"></i>Cambiar de módulo
  </a>
  <a href="#" id="salir" class="salir-lado"><i class="bi bi-box-arrow-left me-2"></i>Cerrar sesión</a>
</aside>

<form id="logoutForm" method="post" action="{% url 'cuentas:logout' %}" class="d-none">{% csrf_token %}</form>

<div class="contenido">
  <div class="topbar d-flex align-items-center px-3 py-2">
    <button class="btn btn-outline-secondary d-lg-none" id="toggle" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
    <img src="{% static 'img/logo.png' %}" alt="Logo CCMG" class="logo-top ms-2 d-lg-none">
    <span class="modulo-tag ms-3 d-none d-lg-inline-flex"><i class="bi bi-houses"></i> Módulo Casas de Vida</span>
    <span class="ms-auto text-end"><strong id="nombre"></strong><br><small id="rolTxt" class="text-muted"></small></span>
  </div>
  <main id="vista" class="p-3 p-md-4"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{{ sesion_js|json_script:"ccmg-sesion" }}
<script src="{% static 'js/auth.js' %}?v=3"></script>
<script src="{% static 'js/loader.js' %}?v=3"></script>
<script src="{% static 'js/panel-common.js' %}?v=3"></script>
<script src="{% static 'js/panel-casas.js' %}?v=3"></script>
<script>setTimeout(function(){var l=document.getElementById('loader');if(l)l.classList.add('hidden');},100);</script>
</body>
</html>
