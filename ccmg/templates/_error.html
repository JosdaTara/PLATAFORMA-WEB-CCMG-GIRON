<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}{% endblock %} | CCMG PVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
<link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body class="panel-body">
<main class="container py-5 text-center" style="max-width:560px">
  <img src="{% static 'img/logo.png' %}" alt="Logo CCMG" height="72" class="mb-4">
  <div class="empty-state bg-white rounded shadow-sm">
    <i class="bi bi-{% block icono %}{% endblock %}"></i>
    <h1 class="h4">{% block encabezado %}{% endblock %}</h1>
    <p class="text-muted">{% block mensaje %}{% endblock %}</p>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
      {% if user.is_authenticated %}
        <a href="{% url 'cuentas:panel_por_rol' %}" class="btn btn-ccmg">Ir a mi panel</a>
      {% else %}
        <a href="{% url 'cuentas:login' %}" class="btn btn-ccmg">Iniciar sesión</a>
      {% endif %}
      <a href="{% url 'publico:index' %}" class="btn btn-light">Página de inicio</a>
    </div>
  </div>
</main>
</body>
</html>
