{% comment %}Campo numérico del reporte de asistencia. Recibe: campo; opcional: grande (campo principal, más visible).{% endcomment %}
<div class="{% if grande %}col-12 col-sm-4 campo-principal{% else %}col-6 col-md-4 col-lg-3{% endif %}">
  <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% for e in campo.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
</div>
