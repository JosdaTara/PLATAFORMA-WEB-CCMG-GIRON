<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
{% include "_tema.html" %}
<title>{% block titulo %}{% endblock %} | CCMG PVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="{% static 'css/styles.css' %}?v=8" rel="stylesheet">
</head>
<body>
<main class="login-wrap py-4">
  <div class="container" style="max-width:480px">
    <div class="card card-ccmg p-4">
      <div class="text-end mb-n4"><button type="button" class="btn btn-sm btn-outline-secondary btn-tema" data-tema-toggle aria-label="Cambiar a modo oscuro"><i class="bi bi-moon-stars" aria-hidden="true"></i></button></div>
      <div class="text-center mb-3">
        <img src="{% static 'img/logo.png' %}" alt="Logo CCMG" height="72">
        <h1 class="h4 mt-2 mb-0">{% block encabezado %}{% endblock %}</h1>
      </div>
      {% block contenido %}{% endblock %}
    </div>
  </div>
</main>
<script src="{% static 'js/comun/theme.js' %}?v=2"></script>
</body>
</html>
