{% comment %}Botón que funciona en todos los clientes de correo (tabla + enlace). Recibe: url, texto.{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:8px auto 24px;">
  <tr>
    <td align="center" bgcolor="#00674F" style="border-radius:10px;">
      <a href="{{ url }}" target="_blank" style="display:inline-block;padding:14px 32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;color:#FFFFFF;text-decoration:none;border-radius:10px;">{{ texto }}</a>
    </td>
  </tr>
</table>
