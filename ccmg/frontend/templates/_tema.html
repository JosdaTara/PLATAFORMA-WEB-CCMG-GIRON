{# Aplica el tema guardado antes de pintar la página, para evitar el destello blanco en modo oscuro. #}
<script>
  (function () {
    var tema = null;
    try { tema = localStorage.getItem('ccmg-theme'); } catch (e) {}
    if (tema !== 'dark' && tema !== 'light') {
      tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    var html = document.documentElement;
    html.setAttribute('data-theme', tema);
    html.setAttribute('data-bs-theme', tema);
  })();
</script>
