<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión | CCMG PVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body>
<div id="loader"><img src="{% static 'img/logo.png' %}" alt="Cargando..."></div>
<div class="login-split">
  <div class="login-banner">
   <picture>
    <source media="(max-width:991px)" srcset="img/banner-movil.jpg">
    <img src="{% static 'img/banner.jpg' %}" alt="Centro Cristiano Misión Global CCMG">
   </picture>
  </div>
  <div class="login-form-side">
   <div class="card card-ccmg p-4 w-100" style="max-width:440px">
    <div class="text-center mb-3"><img src="{% static 'img/logo.png' %}" alt="Logo CCMG" class="logo-login"><h4 class="mt-2">CCMG Girón</h4><small>Plataforma Plan Vida Abundante</small></div>
    <form id="formLogin" novalidate aria-label="Formulario de inicio de sesión">
     <div class="mb-3"><label class="form-label" for="usuario">Usuario o correo</label><input id="usuario" type="text" class="form-control" autocomplete="username" required aria-required="true"></div>
     <div class="mb-3"><label class="form-label" for="clave">Contraseña</label><input id="clave" type="password" class="form-control" autocomplete="current-password" minlength="8" required aria-required="true"><div class="form-text">Mínimo 8 caracteres.</div></div>
     <div class="mb-3"><label class="form-label" for="rol">Rol de acceso</label><select id="rol" class="form-select" aria-label="Seleccionar rol"></select><div class="form-text">Selecciona con qué rol ingresas. En la demo no se validan credenciales contra el servidor.</div></div>
     <div id="error" class="alert alert-danger py-2 d-none" role="alert" aria-live="polite">Ingresa tu usuario y contraseña.</div>
     <button class="btn btn-ccmg w-100">Ingresar</button>
     <a href="index.html" class="d-block text-center mt-3 small">← Volver al inicio</a>
    </form>
   </div>
  </div>
</div>
<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/loader.js' %}"></script>
<script>iniciarLogin();</script>
</body>
</html>
